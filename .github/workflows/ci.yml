name: LaunchPad CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate-project:
    name: Validate LaunchPad Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking LaunchPad project files..."
          test -f index.html
          echo "index.html found successfully!"

      - name: Check HTML content
        run: |
          grep -qi "<!DOCTYPE html>" index.html
          grep -qi "<title>LaunchPad Productivity Dashboard</title>" index.html
          echo "HTML validation successful!"

      - name: CI pipeline completed
        run: |
          echo "LaunchPad CI pipeline completed successfully!"